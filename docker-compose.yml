services:
  mysql:
    image: mysql:8.0
    container_name: wealth-link-mysql
    environment:
      MYSQL_DATABASE: wealth_link
      MYSQL_USER: wealth_link
      MYSQL_PASSWORD: wealth_link
      MYSQL_ROOT_PASSWORD: wealth_link
    ports:
      - "3306:3306"
    volumes:
      - wealth-link-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: wealth-link-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/wealth_link?serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=wealth_link
      - SPRING_DATASOURCE_PASSWORD=wealth_link
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  wealth-link-mysql-data:
