spring:
  application:
    name: wealth-link-platform

  datasource:
    url: jdbc:postgresql://postgres.coolifyprojects.techpulseitservices.com:5432/wealth_link
    username: weatlh
    password: Weatlh@123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations, not Hibernate
    properties:
      hibernate:
        format_sql: true
        default_schema: public
        type.preferred_uuid_jdbc_type: VARCHAR
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    clean-on-validation-error: true
    clean-disabled: false

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: debug
