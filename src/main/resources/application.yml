spring:
  application:
    name: wealth-link-platform

  datasource:
    url: jdbc:mysql://localhost:3306/wealth_link?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: root
    password: Rushee@2002
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations, not Hibernate
    properties:
      hibernate:
        format_sql: true
        default_schema: public
        type.preferred_uuid_jdbc_type: VARCHAR
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    clean-on-validation-error: true
    clean-disabled: false

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: debug
